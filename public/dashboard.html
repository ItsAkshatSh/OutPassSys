<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Out Pass System</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="#">Out Pass System</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link active" href="dashboard.html">Dashboard</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="history.html">History</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="row">
            <div class="col-md-4">
                <div class="card">
                    <div class="card-header">
                        <h5 class="mb-0">Create New Out Pass</h5>
                    </div>
                    <div class="card-body">
                        <form id="ticketForm">
                            <div class="mb-3">
                                <label for="studentName" class="form-label">Student Name</label>
                                <input type="text" class="form-control" id="studentName" required>
                            </div>
                            <div class="mb-3">
                                <label for="grade" class="form-label">Grade</label>
                                <input type="text" class="form-control" id="grade" required>
                            </div>
                            <div class="mb-3">
                                <label for="reason" class="form-label">Reason</label>
                                <textarea class="form-control" id="reason" rows="3" required></textarea>
                            </div>
                            <div class="mb-3">
                                <label for="time" class="form-label">Time</label>
                                <input type="time" class="form-control" id="time" required>
                            </div>
                            <button type="submit" class="btn btn-primary">Create Out Pass</button>
                        </form>
                    </div>
                </div>
            </div>
            <div class="col-md-8">
                <div class="card">
                    <div class="card-header">
                        <h5 class="mb-0">Active Out Passes</h5>
                    </div>
                    <div class="card-body">
                        <div class="table-responsive">
                            <table class="table">
                                <thead>
                                    <tr>
                                        <th>Student Name</th>
                                        <th>Grade</th>
                                        <th>Reason</th>
                                        <th>Time</th>
                                        <th>Created At</th>
                                        <th>Actions</th>
                                    </tr>
                                </thead>
                                <tbody id="ticketList"></tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        async function loadTickets() {
            try {
                const response = await fetch('/api/tickets/active');
                const tickets = await response.json();
                const ticketList = document.getElementById('ticketList');
                ticketList.innerHTML = '';

                tickets.forEach(ticket => {
                    const row = document.createElement('tr');
                    row.innerHTML = `
                        <td>${ticket.studentName}</td>
                        <td>${ticket.grade}</td>
                        <td>${ticket.reason}</td>
                        <td>${ticket.time}</td>
                        <td>${new Date(ticket.created_at).toLocaleString()}</td>
                        <td>
                            <button class="btn btn-sm btn-primary" onclick="closeTicket(${ticket.id})">Close</button>
                        </td>
                    `;
                    ticketList.appendChild(row);
                });
            } catch (error) {
                console.error('Error loading tickets:', error);
            }
        }

        document.getElementById('ticketForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const studentName = document.getElementById('studentName').value;
            const grade = document.getElementById('grade').value;
            const reason = document.getElementById('reason').value;
            const time = document.getElementById('time').value;

            try {
                const response = await fetch('/api/tickets', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ studentName, grade, reason, time })
                });

                if (response.ok) {
                    document.getElementById('ticketForm').reset();
                    loadTickets();
                } else {
                    alert('Error creating out pass');
                }
            } catch (error) {
                alert('Error creating out pass');
            }
        });

        async function closeTicket(ticketId) {
            try {
                const response = await fetch(`/api/tickets/${ticketId}/close`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json'
                    }
                });

                if (response.ok) {
                    loadTickets();
                } else {
                    alert('Error closing out pass');
                }
            } catch (error) {
                alert('Error closing out pass');
            }
        }

        loadTickets();
    </script>
</body>
</html>
